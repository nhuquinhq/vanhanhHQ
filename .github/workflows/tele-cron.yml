# Lịch bắn báo cáo Telegram — gọi /api/tele trên Vercel
# Bộ hẹn giờ GitHub KHÔNG đáng tin: 21–23/10 khai 33 lần gõ cửa/ngày mà chỉ nhả ~2 job/ngày,
# lại vào những giờ không hề khai (02h57 · 14h45 · 16h49 · 22h50 giờ VN). Vì thế server KHÔNG
# bắt đúng giờ nữa: với slot=auto, mỗi lần gõ cửa thuộc về MỐC GẦN NHẤT ĐÃ QUA (8h/12h/18h/23h),
# mỗi mốc chỉ gửi 1 lần/ngày (đánh dấu trong KV) → tin có thể đến muộn chút nhưng không bị mất.
# Mốc 8h sáng CHỈ dành cho tin chốt số ngày hôm trước (hiện là báo cáo L5), báo cáo khác đi qua thì im.
# Giờ cron ghi theo UTC = giờ VN trừ 7
# File đổi tên từ tele-schedule.yml: GitHub không chịu đăng ký lịch mới trên file cũ (vẫn chạy 3 mốc cũ) — file mới = đăng ký cron mới từ đầu
name: Ban bao cao Telegram v2
on:
  schedule:
    # GitHub bỏ rơi phần lớn lần gõ cửa và nhả job vào giờ không hề khai (xem ghi chú trên),
    # nên gõ mỗi giờ một lần: server tự xếp lần gõ vào MỐC gần nhất đã qua, mỗi mốc 1 lần/ngày.
    # Hai mốc quan trọng (08h chốt L5 · 18h nhập hàng) còn được Vercel Cron gõ riêng cho chắc.
    - cron: '17 * * * *'
    - cron: '3,23,43 1-2 * * *'    # mốc 08:00 VN — tin CHỐT số ngày hôm trước
    - cron: '3,23,43 5-7 * * *'    # mốc 12:00 VN
    - cron: '3,23,43 11-13 * * *'  # mốc 18:00 VN
    - cron: '3,23,43 16-18 * * *'  # mốc 23:00 VN
  workflow_dispatch:      # bắn tay từ tab Actions: để trống = gửi ngay · gac=auto = qua gác giờ VN (chống trùng khung)
    inputs:
      gac:
        description: 'auto = qua gac gio VN (dung khung 8h/12h/18h/23h moi gui, chong trung) · de trong = gui ngay'
        required: false
        default: ''
      bao_cao:
        description: 'Bao cao can ban: nv (nang suat) · nhap (nhap hang USDT+VND) · l5 (team Currency) · liet ke nhieu cai cach nhau dau phay · pvh10 DA TAT'
        required: false
        default: 'nv,nhap,l5'
      them:
        description: 'Tham so phu de chan doan, vd: diag=423402286 (soi tab) · dry=1 (xem thu, khong gui)'
        required: false
        default: ''

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Goi bot bao cao PVH10
        run: |
          if [ -z "${{ secrets.TELE_FIRE_URL }}" ]; then
            echo "Chua khai bao secret TELE_FIRE_URL (Settings -> Secrets and variables -> Actions)"; exit 1
          fi
          URL="${{ secrets.TELE_FIRE_URL }}"
          # r= liet ke bao cao can ban; xoa r= co san trong secret truoc roi moi gan, keo chon 1 bao cao
          # ma van dinh kem bao cao cu (URL co 2 tham so r -> server gop ca hai)
          R="${{ inputs.bao_cao }}"; [ -z "$R" ] && R="nv,nhap,l5"
          URL=$(printf '%s' "$URL" | sed -E 's/([?&])r=[^&]*/\1/g; s/\?&+/?/; s/&&+/\&/g; s/[?&]+$//')
          case "$URL" in *\?*) URL="$URL&r=$R";; *) URL="$URL?r=$R";; esac
          # chay theo lich -> them slot=auto de server gac gio VN; ban tay tu tab Actions -> gui ngay
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.gac }}" = "auto" ]; then
            URL="$URL&slot=auto"
          fi
          [ -n "${{ inputs.them }}" ] && URL="$URL&${{ inputs.them }}"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" "$URL")
          cat /tmp/resp.json; echo
          if [ -n "${{ inputs.them }}" ]; then [ "$code" = "200" ]; else
            [ "$code" = "200" ] && grep -q '"ok":true' /tmp/resp.json
          fi
